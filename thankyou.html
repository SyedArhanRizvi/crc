<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .thankyou-box {
            background: #ffffff;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
        }

        .thankyou-box h1 {
            color: #28a745;
            margin-bottom: 10px;
        }

        .thankyou-box p {
            color: #555;
            font-size: 16px;
        }

        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn-home:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <div class="thankyou-box">
        <h1>Thank You!</h1>
        <p>Your enquiry has been submitted successfully.</p>
        <p>Our team will contact you shortly.</p>

        <a href="index.html" class="btn-home">Back to Home</a>
    </div>

</body>
</html>
